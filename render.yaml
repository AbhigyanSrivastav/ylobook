services:
  - type: web
    name: ylobook-api
    runtime: python
    plan: free
    buildCommand: pip install ./ylobook-backend
    startCommand: uvicorn ylobook_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
